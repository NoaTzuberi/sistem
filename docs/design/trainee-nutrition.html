<style>
/* Layout: "training OS" nutrition. Portions are the core: 4 group rows with tappable tokens. Exchange list in a bottom sheet per group. Meal photos strip. Full-menu mode adds meal cards underneath. Light-only by design. */
:root {
  --bg: #FFFFFF; --ink: #141116; --ink2: #2A2530; --muted: #7A7380; --faint: #B7B0BC; --rule: #ECE9EE; --soft: #F5F3F6;
  --pink: #FF006E; --cherry: #A50047; --blush: #FFE3EF;
  --P: #FF006E; --Pt: #C80058; --Ps: #FFE3EE; --C: #7C4DFF; --Ct: #5B2FD6; --Cs: #EFE7FF; --F: #FF7A00; --Ft: #C75A00; --Fs: #FFEBD6; --S: #0094FF; --St: #0070C9; --Ss: #E1F1FF;
  --num: 'Barlow Condensed', 'Rubik', sans-serif; --he: 'Karantina', 'Rubik', sans-serif; --mono: 'JetBrains Mono', ui-monospace, monospace; --font: 'Rubik', 'Heebo', system-ui, sans-serif;
  --ease-out: cubic-bezier(0.23, 1, 0.32, 1); --spring: cubic-bezier(.34,1.56,.64,1); --sheet: cubic-bezier(.32,.72,0,1);
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; font-family: var(--font); color: var(--ink); direction: rtl; background: #E9E6EA; padding-block: 20px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
button { font: inherit; color: inherit; cursor: pointer; }
.n { font-family: var(--num); font-variant-numeric: tabular-nums; }
.he { font-family: var(--he); font-weight: 700; line-height: 0.86; }
.eyb { display: inline-flex; align-items: baseline; gap: 8px; }
.eyb code { font-family: var(--mono); font-size: 10px; font-weight: 700; letter-spacing: 1.2px; color: var(--faint); }
.review { display: flex; justify-content: center; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; align-items: center; }
.review span { font-size: 12px; color: var(--muted); }
.rv { position: relative; display: grid; grid-template-columns: 1fr 1fr; padding: 3px; border-radius: 14px; background: #fff; box-shadow: 0 2px 8px rgba(20,17,22,0.06); }
.rv button { height: 34px; padding: 0 16px; border: 0; border-radius: 11px; background: none; font-size: 13px; font-weight: 600; color: var(--muted); }
.rv button[aria-pressed="true"] { background: var(--ink); color: #fff; }
.stage { display: flex; justify-content: center; }
.phone { position: relative; width: 390px; max-width: 100%; height: 844px; border-radius: 54px; overflow: hidden; background: var(--bg); box-shadow: 0 0 0 10px #141116, 0 0 0 11px #3a3540, 0 40px 90px rgba(20,17,22,0.3); }
.island { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); width: 120px; height: 34px; border-radius: 20px; background: #000; z-index: 60; }
.scr { position: absolute; inset: 0; overflow-y: auto; scrollbar-width: none; padding: 0 0 130px; }
.scr::-webkit-scrollbar { display: none; }

.hdr { position: sticky; top: 0; z-index: 20; padding: 58px 20px 10px; background: rgba(255,255,255,0.9); -webkit-backdrop-filter: blur(20px) saturate(180%); backdrop-filter: blur(20px) saturate(180%); }
.tt { display: flex; align-items: flex-end; justify-content: space-between; gap: 10px; }
.tt h1 { margin: 0; font-family: var(--he); font-weight: 700; font-size: 58px; line-height: 0.8; }
.tt small { display: flex; flex-direction: column; align-items: flex-start; gap: 3px; font-size: 12px; color: var(--muted); margin-top: 8px; white-space: nowrap; }
.cam { white-space: nowrap; flex: none; height: 40px; padding: 0 14px; border: 0; border-radius: 20px; background: var(--ink); color: #fff; font-size: 13px; font-weight: 700; display: inline-flex; align-items: center; gap: 7px; transition: transform 140ms var(--ease-out); }
.cam:active { transform: scale(0.96); }
.days { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; margin-top: 14px; }
.day { border: 0; background: none; padding: 6px 0; border-radius: 14px; display: flex; flex-direction: column; align-items: center; gap: 3px; transition: background-color 150ms ease; }
.day small { font-size: 11px; color: var(--muted); font-weight: 600; }

.day .ring { width: 26px; height: 4px; border-radius: 2px; background: var(--soft); overflow: hidden; }
.day .ring i { display: block; height: 100%; width: var(--v); background: var(--ink); border-radius: 2px; }
.day[aria-pressed="true"] b { background: var(--ink); color: #fff; }
.day.fut b { color: var(--faint); } .day.fut .ring { opacity: 0.4; }

.pad { padding: 0 20px; }
.coach { margin-top: 14px; display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: 20px; background: var(--soft); width: 100%; border: 0; text-align: start; }
.coach .av { width: 32px; height: 32px; border-radius: 50%; background: var(--ink); color: #fff; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex: none; position: relative; }
.coach .av::after { content: ''; position: absolute; top: -1px; inset-inline-end: -1px; width: 9px; height: 9px; border-radius: 50%; background: var(--pink); box-shadow: 0 0 0 2px var(--soft); }
.coach div { flex: 1; min-width: 0; }
.coach b { font-family: var(--he); font-size: 20px; font-weight: 700; line-height: 1; display: block; }
.coach p { margin: 3px 0 0; font-size: 13px; line-height: 1.5; color: var(--ink2); display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
.coach.open p { -webkit-line-clamp: unset; display: block; }
.coach svg { flex: none; margin-top: 4px; color: var(--muted); transition: transform 250ms var(--ease-out); }
.coach.open svg { transform: rotate(180deg); }

/* summary */
.sum { margin-top: 16px; display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
.sum .big b { font-family: var(--num); font-weight: 700; font-size: 64px; line-height: 0.85; direction: ltr; display: inline-block; }
.sum .big b small { font-size: 26px; color: var(--faint); }
.sum .big span { display: block; font-size: 12px; color: var(--muted); margin-top: 4px; }
.mix { display: flex; height: 10px; width: 150px; border-radius: 5px; overflow: hidden; background: var(--soft); direction: rtl; }
.mix i { height: 100%; width: var(--w); background: var(--c); transition: width 300ms var(--ease-out); }
.mix-w { text-align: left; }
.mix-w span { display: block; font-size: 11px; color: var(--muted); margin-bottom: 6px; }

/* group rows: fuel cells. Each portion = a capsule of two half-cells; tap or drag along the bar. */
.groups { margin-top: 10px; }
.fc-row { --c: var(--P); --t: var(--Pt); --s: var(--Ps); padding: 16px 0 14px; border-top: 1px solid var(--rule); }
.fc-h { display: flex; align-items: center; gap: 10px; }
.fc-ic { width: 38px; height: 38px; flex: none; border-radius: 50%; background: var(--c); color: #fff; display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 14px color-mix(in srgb, var(--c) 35%, transparent); transition: transform 320ms var(--spring); }
.fc-row.pop .fc-ic { animation: fcPop 420ms var(--spring); }
@keyframes fcPop { 40% { transform: scale(1.16) rotate(-8deg); } }
.fc-h b { font-family: var(--he); font-weight: 700; font-size: 32px; line-height: 0.8; }
.fc-cnt { margin-inline-start: auto; font-family: var(--num); font-weight: 700; font-size: 30px; line-height: 1; color: var(--t); }
.fc-cnt small { font-size: 18px; color: var(--faint); }
.fc-bar { display: flex; gap: 5px; margin-top: 12px; touch-action: none; user-select: none; -webkit-user-select: none; }
.fc-p { position: relative; flex: 1; display: flex; gap: 2px; }
.fc-p.hf { flex: 0.5; }
.fc-c { position: relative; flex: 1; height: 40px; border: 0; padding: 0; background: var(--s); overflow: hidden; cursor: pointer; }
.fc-p .fc-c:first-child { border-start-start-radius: 13px; border-end-start-radius: 13px; }
.fc-p .fc-c:last-child { border-start-end-radius: 13px; border-end-end-radius: 13px; }
/* RTL fills from the right edge of each cell */
.fc-c::after { content: ''; position: absolute; inset: 0; background: var(--c); transform: scaleX(0); transform-origin: 100% 50%; transition: transform 300ms var(--ease-out); transition-delay: var(--d, 0ms); }
.fc-c.on::after { transform: scaleX(1); }
.fc-c.tip::before { content: ''; position: absolute; z-index: 1; top: 11px; bottom: 11px; inset-inline-end: 6px; width: 3px; border-radius: 2px; background: rgba(255,255,255,0.9); }
.fc-num { position: absolute; z-index: 1; top: 6px; inset-inline-start: 8px; line-height: 1; font-family: var(--mono); font-size: 10px; font-weight: 700; color: var(--t); opacity: 0.45; pointer-events: none; transition: color 200ms ease, opacity 200ms ease; }
.fc-p.full .fc-num { color: #fff; opacity: 0.85; }
.fc-meta { display: flex; align-items: center; gap: 8px; margin-top: 10px; font-size: 12px; color: var(--muted); min-height: 30px; }
.fc-meta b { color: var(--t); font-weight: 700; }
.fc-meta .ok { color: var(--cherry); font-weight: 700; display: inline-flex; align-items: center; gap: 5px; }
.fc-meta .ov { height: 22px; padding: 0 8px; border-radius: 11px; background: #FFF4E5; color: #8A4A00; font-weight: 700; display: inline-flex; align-items: center; }
.fc-opt { margin-inline-start: auto; height: 30px; padding: 0 10px 0 12px; border: 0; border-radius: 15px; background: var(--s); color: var(--t); font-size: 12px; font-weight: 700; display: inline-flex; align-items: center; gap: 4px; transition: transform 140ms var(--ease-out), filter 150ms ease; }
.fc-opt:active { transform: scale(0.97); }
.veg { margin-top: 4px; display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 18px; border: 1.5px dashed #E2DDE3; font-size: 13px; color: var(--muted); }
.veg b { font-family: var(--he); font-size: 22px; color: var(--ink); font-weight: 700; line-height: 1; }

/* photos */
.sh { display: flex; align-items: baseline; justify-content: space-between; margin: 26px 0 12px; }
.sh h2 { margin: 0; font-size: 13px; font-weight: 600; color: var(--ink2); }
.sh button { border: 0; background: none; padding: 0; font-size: 13px; font-weight: 600; color: var(--pink); }
.photos { display: grid; grid-auto-flow: column; grid-auto-columns: 110px; gap: 8px; overflow-x: auto; scrollbar-width: none; margin: 0 -20px; padding: 0 20px; }
.photos::-webkit-scrollbar { display: none; }
.ph { position: relative; height: 130px; border: 0; border-radius: 18px; overflow: hidden; padding: 0; background: var(--g); }
.ph span { position: absolute; bottom: 8px; inset-inline-start: 8px; height: 22px; padding: 0 8px; border-radius: 11px; background: rgba(255,255,255,0.9); font-size: 11px; font-weight: 700; display: inline-flex; align-items: center; }
.ph.add { background: var(--soft); box-shadow: inset 0 0 0 1.5px var(--rule); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; color: var(--muted); font-size: 12px; font-weight: 600; }
.ph.add i { width: 40px; height: 40px; border-radius: 50%; background: var(--ink); color: #fff; display: flex; align-items: center; justify-content: center; }

/* menu mode */
.meal { border-radius: 24px; border: 1px solid var(--rule); padding: 14px; margin-bottom: 10px; }
.mh { display: flex; align-items: center; gap: 10px; }
.mh b { font-family: var(--he); font-weight: 700; font-size: 28px; line-height: 0.85; }
.mh time { font-family: var(--num); font-weight: 700; font-size: 16px; color: var(--muted); }
.mh .done { margin-inline-start: auto; height: 34px; padding: 0 14px; border: 0; border-radius: 17px; background: var(--ink); color: #fff; font-size: 12px; font-weight: 700; display: inline-flex; align-items: center; gap: 6px; transition: background-color 200ms ease, transform 140ms var(--ease-out); }
.mh .done.ok { background: var(--blush); color: var(--cherry); }
.mh .done:active { transform: scale(0.96); }
.mo { display: flex; gap: 4px; margin: 10px 0 8px; }
.mo button { height: 28px; padding: 0 12px; border: 0; border-radius: 14px; background: none; font-size: 12px; font-weight: 600; color: var(--muted); }
.mo button[aria-pressed="true"] { background: var(--soft); color: var(--ink); }
.mi { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-top: 1px solid var(--rule); font-size: 14px; }
.mi i { width: 22px; height: 22px; border-radius: 7px; background: var(--s); color: var(--t); font-style: normal; font-family: var(--num); font-weight: 700; font-size: 13px; display: flex; align-items: center; justify-content: center; flex: none; }
.mi span { flex: 1; } .mi small { font-size: 12px; color: var(--muted); }
.mi .sw { border: 0; background: none; padding: 4px 6px; border-radius: 10px; color: var(--muted); font-size: 11px; font-weight: 700; display: inline-flex; align-items: center; gap: 4px; }

/* sheet */
.scrim { position: absolute; inset: 0; z-index: 70; background: rgba(20,17,22,0.35); transition: opacity 240ms ease; }
.scrim[data-off] { opacity: 0; pointer-events: none; }
.sheet { position: absolute; inset-inline: 0; bottom: 0; z-index: 71; height: 82%; display: flex; flex-direction: column; border-radius: 32px 32px 0 0; background: #fff; box-shadow: 0 -20px 50px rgba(20,17,22,0.25); transition: transform 300ms var(--sheet); }
.sheet[data-off] { transform: translateY(104%); transition-duration: 200ms; }
.grab { width: 40px; height: 5px; border-radius: 3px; background: #D8D3DB; margin: 10px auto 2px; flex: none; }
.sh-h { padding: 8px 20px 10px; }
.sh-h h3 { display: flex; align-items: center; gap: 12px; margin: 0; font-family: var(--he); font-weight: 700; font-size: 44px; line-height: 0.85; color: var(--t); }
.sh-h p { margin: 6px 0 0; font-size: 13px; color: var(--muted); }
.gtabs { display: flex; gap: 6px; padding: 0 20px 10px; overflow-x: auto; scrollbar-width: none; }
.gtabs button { flex: none; height: 34px; padding: 0 14px; border: 0; border-radius: 17px; background: var(--soft); font-size: 13px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; }
.gtabs button svg { color: var(--c); }
.gtabs button[aria-pressed="true"] { background: var(--c); color: #fff; } .gtabs button[aria-pressed="true"] svg { color: #fff; }
.srch { margin: 0 20px 6px; display: flex; align-items: center; gap: 8px; height: 42px; padding: 0 14px; border-radius: 21px; background: var(--soft); color: var(--muted); }
.srch input { flex: 1; min-width: 0; border: 0; outline: 0; background: none; font: inherit; color: var(--ink); }
.srch:focus-within { background: #fff; box-shadow: 0 0 0 2px var(--pink); }
.flist { flex: 1; overflow-y: auto; padding: 4px 20px 24px; }
.fcat { font-size: 11px; font-weight: 700; color: var(--faint); margin: 12px 0 2px; letter-spacing: 0.3px; }
.fo { width: 100%; border: 0; background: none; padding: 12px 0; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; text-align: start; border-bottom: 1px solid var(--rule); }
.fo b { display: block; font-size: 15px; font-weight: 600; } .fo small { font-size: 12px; color: var(--muted); }
.fo .add { height: 34px; padding: 0 12px; border-radius: 17px; background: var(--s); color: var(--t); font-size: 12px; font-weight: 700; display: inline-flex; align-items: center; gap: 4px; transition: background-color 150ms ease, color 150ms ease; }
.fo.added .add { background: var(--c); color: #fff; }

.toast { position: absolute; left: 50%; bottom: 110px; z-index: 80; transform: translate(-50%, 20px); opacity: 0; height: 40px; padding: 0 16px; border-radius: 20px; background: var(--ink); color: #fff; font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 8px; white-space: nowrap; transition: opacity 200ms ease, transform 300ms var(--ease-out); pointer-events: none; }
.toast.on { opacity: 1; transform: translate(-50%, 0); }

/* dock */
.dock { position: absolute; bottom: 22px; left: 50%; transform: translateX(-50%); z-index: 30; display: flex; gap: 4px; padding: 6px; border-radius: 34px; background: var(--ink); box-shadow: 0 16px 36px rgba(20,17,22,0.35); }
.dk { height: 54px; min-width: 54px; padding: 0 16px; border: 0; border-radius: 27px; background: transparent; color: rgba(255,255,255,0.55); display: flex; align-items: center; justify-content: center; gap: 0; }
.dk .l { max-width: 0; opacity: 0; overflow: hidden; white-space: nowrap; font-size: 13px; font-weight: 700; }
.dk[aria-current="page"] { background: var(--pink); color: #fff; padding: 0 18px; gap: 8px; box-shadow: 0 6px 16px rgba(255,0,110,0.45); }
.dk[aria-current="page"] .l { max-width: 80px; opacity: 1; }
.hi { position: absolute; bottom: 7px; left: 50%; transform: translateX(-50%); width: 130px; height: 5px; border-radius: 3px; background: var(--ink); z-index: 31; opacity: 0.85; }
@media (hover: hover) and (pointer: fine) {

  .day:not([aria-pressed="true"]):hover { background: var(--soft); }
  .fc-c:hover { filter: brightness(0.96); } .fc-opt:hover { filter: brightness(0.96); }
  .fo:hover b { color: var(--t); } .mh .done:hover { background: var(--ink2); } .mh .done.ok:hover { background: #FFD3E5; }
  .gtabs button:not([aria-pressed="true"]):hover { background: #ECE8EE; }
}
@media (max-width: 440px) { body { padding: 0; } .review { padding: 10px 16px 0; } .phone { width: 100%; height: calc(100dvh - 60px); border-radius: 0; box-shadow: none; } .island, .hi { display: none; } .hdr { padding-top: max(16px, env(safe-area-inset-top, 0px)); } }
@media (prefers-reduced-motion: reduce) { .fc-c::after, .fc-ic, .sheet, .scrim, .toast, .mix i { transition-duration: 1ms !important; transition-delay: 0ms !important; } .fc-row.pop .fc-ic { animation: none; } }
:focus-visible { outline: 2px solid var(--pink); outline-offset: 2px; }
</style>

  render();

  var toastT;

  function popRow(k) { if (RM) return; var r = document.querySelector('[data-row="' + k + '"]'); if (r) { r.classList.remove('pop'); void r.offsetWidth; r.classList.add('pop'); } }

  // fuel cells: tap a cell = fill up to it (tap the last filled cell = empty it); drag along the bar to fill/empty
